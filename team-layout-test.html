<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Layout Test</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

@font-face{
font-family:"Fifa26";
src:url(
"assets/fonts/fifa-26.otf.woff2"
) format("woff2");

font-weight:900;
font-style:normal;
}

body{
font-family:Arial,sans-serif;
background:#ddd0a6;
padding:30px;
}

.album-test{
max-width:1400px;
margin:auto;
background:#123f8c;
display:grid;
grid-template-columns:1fr 1fr;
min-height:820px;
box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.page{
position:relative;
padding:34px;
overflow:hidden;
}

.left-page{
background:
linear-gradient(135deg,#ffffff 0 32%,transparent 32%),
linear-gradient(90deg,#123f8c 0 70%,#e0a900 70%);
}

.right-page{
background:
linear-gradient(135deg,#e52525 0 18%,transparent 18%),
linear-gradient(90deg,#123f8c 0 72%,#e0a900 72%);
}

.left-page .stickers-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
grid-template-areas:
"header header s1 s2"
"s3 s4 s5 s6"
"s7 s8 s9 s10";
gap:16px;
}

.right-page .stickers-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
grid-template-areas:
"s11 s12 special special"
"s14 s15 s16 s17"
"group group s18 s19";
gap:16px;
margin-top:58px;
}

.team-header{
grid-area:header;
padding-right:10px;
}

.kicker{
font-family:"Fifa26",Arial,sans-serif;
font-size:60px;
line-height:.65;
letter-spacing:-5px;
transform:scaleY(1.05);
color:#17306f;
margin-bottom: 20px;
}

.country-name{
font-size:40px;
font-weight:900;
color:#d92525;
line-height:.9;
margin-top:8px;
}

.association{
display:flex;
gap:12px;
margin-top:22px;
font-size:20px;
font-weight:800;
color:#17306f;
}

.flag{
width:70px;
height:46px;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.slot{
aspect-ratio:3/4;
background:#91a8c8;
border:4px solid #17306f;
position:relative;
overflow:hidden;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.slot.gold{
background:#e0a900;
}

.slot-horizontal{
aspect-ratio:2/1;
}

.slot.empty::before{
content:"";
position:absolute;
top:18px;
left:18px;
right:18px;
height:38%;
background:#f3f3f3;
border-radius:0 28px 0 0;
}

.slot.empty::after{
content:"";
position:absolute;
left:18px;
right:18px;
bottom:28px;
height:33%;
background:#f3f3f3;
border-radius:0 28px 0 0;
}

.code{
position:absolute;
top:28px;
left:0;
right:0;
text-align:center;
font-weight:900;
color:#7d8fac;
font-size:18px;
z-index:2;
}

.number{
position:absolute;
top:52px;
left:0;
right:0;
text-align:center;
font-weight:900;
color:#7d8fac;
font-size:18px;
z-index:2;
}

.name{
position:absolute;
bottom:48px;
left:0;
right:0;
text-align:center;
font-size:12px;
font-weight:800;
color:#7d8fac;
z-index:2;
text-transform:uppercase;
}

.filled{
padding:0;
}

.sticker-img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.sticker-label{
position:absolute;
bottom:10px;
left:10px;
background:white;
padding:5px 10px;
font-size:12px;
font-weight:bold;
border-radius:8px;
}

.group-box{
grid-area:group;
background:#67b556;
border-radius:140px 0 0 0;
padding:50px 30px 25px;
color:white;
min-height:210px;
}

.group-box h3{
font-size:34px;
margin-bottom:12px;
}

.group-teams{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
font-weight:bold;
}

.slot-1{grid-area:s1;}
.slot-2{grid-area:s2;}
.slot-3{grid-area:s3;}
.slot-4{grid-area:s4;}
.slot-5{grid-area:s5;}
.slot-6{grid-area:s6;}
.slot-7{grid-area:s7;}
.slot-8{grid-area:s8;}
.slot-9{grid-area:s9;}
.slot-10{grid-area:s10;}
.slot-11{grid-area:s11;}
.slot-12{grid-area:s12;}
.slot-13{grid-area:special;}
.slot-14{grid-area:s14;}
.slot-15{grid-area:s15;}
.slot-16{grid-area:s16;}
.slot-17{grid-area:s17;}
.slot-18{grid-area:s18;}
.slot-19{grid-area:s19;}
</style>
</head>

<body>

<div class="album-test">

<section class="page left-page">

<div class="stickers-grid">

<div class="team-header">
<div class="kicker">WE ARE</div>
<div class="country-name">KOREA REPUBLIC</div>

<div class="association">
<div class="flag">KOR</div>
<div>Korea Football<br>Association</div>
</div>
</div>

<div class="slot gold empty slot-1 sticker-slot" data-id="1"></div>
<div class="slot empty slot-2 sticker-slot" data-id="2"></div>
<div class="slot empty slot-3 sticker-slot" data-id="3"></div>
<div class="slot empty slot-4 sticker-slot" data-id="4"></div>
<div class="slot empty slot-5 sticker-slot" data-id="5"></div>
<div class="slot empty slot-6 sticker-slot" data-id="6"></div>
<div class="slot empty slot-7 sticker-slot" data-id="7"></div>
<div class="slot empty slot-8 sticker-slot" data-id="8"></div>
<div class="slot empty slot-9 sticker-slot" data-id="9"></div>
<div class="slot empty slot-10 sticker-slot" data-id="10"></div>

</div>

</section>

<section class="page right-page">

<div class="stickers-grid">

<div class="slot empty slot-11 sticker-slot" data-id="11"></div>
<div class="slot empty slot-12 sticker-slot" data-id="12"></div>

<div class="slot gold empty slot-13 slot-horizontal sticker-slot"
data-id="13"></div>

<div class="slot empty slot-14 sticker-slot" data-id="14"></div>
<div class="slot empty slot-15 sticker-slot" data-id="15"></div>
<div class="slot empty slot-16 sticker-slot" data-id="16"></div>
<div class="slot empty slot-17 sticker-slot" data-id="17"></div>

<div class="group-box">
<h3>GROUP A</h3>

<div class="group-teams">
<span>MEX 🇲🇽</span>
<span>RSA 🇿🇦</span>
<span>KOR 🇰🇷</span>
<span>CZE 🇨🇿</span>
</div>

</div>

<div class="slot empty slot-18 sticker-slot" data-id="18"></div>
<div class="slot empty slot-19 sticker-slot" data-id="19"></div>

</div>

</section>

</div>

<script>

const slots =
document.querySelectorAll(
".sticker-slot"
);

let albumData =
JSON.parse(
localStorage.getItem(
"teamAlbum"
)
) || {};

render();

slots.forEach(slot=>{

slot.addEventListener(
"click",
()=>{

const id =
slot.dataset.id;

albumData[id] =
!albumData[id];

saveAlbum();

render();

}
);

});

function render(){

slots.forEach(slot=>{

const id =
slot.dataset.id;

slot.innerHTML="";

slot.classList.remove(
"filled"
);

slot.classList.add(
"empty"
);

if(albumData[id]){

slot.classList.add(
"filled"
);

slot.classList.remove(
"empty"
);

slot.innerHTML=
`
<img
src="assets/img/01.png"
class="sticker-img">

<div class="sticker-label">

KOR ${id}

</div>
`;

}else{

slot.innerHTML=
`
<div class="code">
KOR
</div>

<div class="number">
${id}
</div>

<div class="name">
PLAYER
</div>
`;

}

});

}

function saveAlbum(){

localStorage.setItem(
"teamAlbum",
JSON.stringify(
albumData
)
);

}

</script>

</body>
</html>
