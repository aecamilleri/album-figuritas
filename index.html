<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álbum Figuritas</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<section id="cover" class="album-cover album-cover-worldcup">

  <div class="cover-side cover-side-left">
    <span>2</span>
    <span>0</span>
    <span>2</span>
    <span>6</span>
  </div>

  <div class="cover-center">
    <div class="cover-year">2026</div>

    <div class="cover-trophy-placeholder">
      TROPHY
    </div>

    <div class="cover-brand">WORLD CUP</div>

    <button id="openAlbum">
      Abrir álbum
    </button>
  </div>

  <div class="cover-side cover-side-right">
    <span>2</span>
    <span>0</span>
    <span>2</span>
    <span>6</span>
  </div>

</section>

  <section id="albumPage" class="album-page">

    <div class="album-header">
      <div>
        <span class="album-label">ROAD TO WORLD CUP 2026</span>
        <h2 id="countryTitle">Argentina</h2>
        <p id="countrySubtitle">Football Association</p>
      </div>

      <div id="countryFlag" class="country-flag">ARG</div>
    </div>

    <div class="progress-box">
      <p id="progressText">0 / 15 figuritas pegadas</p>
      <div class="progress-bar">
        <div id="progressFill"></div>
      </div>
    </div>

    <div id="countryNav" class="country-nav"></div>

    <div class="album-spread">
      <div id="albumGrid" class="album-grid"></div>
    </div>

  </section>

</div>

<script src="script.js"></script>
</body>
</html>
